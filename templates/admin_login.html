<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Admin Login — Avida Residence New Manila VisitorsHub</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500&family=DM+Mono:wght@400&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#0f1419;--surface:#1a1f2e;--border:#2a3441;--accent:#e53e3e;--danger:#ff3b5c;
      --text:#ffffff;--muted:#a0aec0;--card:rgba(26, 31, 46, 0.8)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;
     display:flex;align-items:center;justify-content:center;
     background-image:url('/static/img/bg.png'), radial-gradient(ellipse 60% 50% at 50% 0%,rgba(0,119,255,.07),transparent);
     background-size:cover, auto;background-position:center, center;background-repeat:no-repeat, no-repeat}
.card{background:rgba(19,22,30,0.95);border:1px solid var(--border);border-radius:16px;
      padding:2.5rem;width:min(420px,90vw);backdrop-filter:blur(10px)}
.logo{display:flex;align-items:center;justify-content:center;gap:0.75rem;margin-bottom:1.5rem}
.logo img{height:40px;width:auto}
.subtitle{text-align:center;color:var(--muted);font-size:.8rem;font-family:'DM Mono',monospace;
          letter-spacing:.1em;margin-bottom:2rem}
.form-group{margin-bottom:1rem}
label{display:block;font-size:.75rem;color:var(--muted);margin-bottom:.4rem;font-family:'DM Mono',monospace}
input{width:100%;background:#0d0f15;border:1px solid var(--border);border-radius:8px;
      padding:.65rem 1rem;color:var(--text);font-family:'DM Sans',sans-serif;font-size:.9rem;
      outline:none;transition:border-color .2s}
input:focus{border-color:var(--accent)}
.btn{width:100%;padding:.75rem;background:var(--accent);color:#fff;border:none;border-radius:8px;
     font-family:'DM Sans',sans-serif;font-size:.9rem;font-weight:600;cursor:pointer;
     margin-top:.5rem;transition:all .3s}
.btn:hover{background:#ff4757;transform:translateY(-2px);box-shadow:0 4px 12px rgba(229,62,62,0.4)}
.error{background:rgba(255,59,92,.1);border:1px solid rgba(255,59,92,.25);color:#ff6b84;
       padding:.65rem 1rem;border-radius:8px;font-size:.85rem;margin-bottom:1rem}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <img src="/static/img/logo.png" alt="Avida Residence New Manila VisitorsHub Logo"/>
  </div>
  <div class="subtitle">CONDOMINIUM MANAGEMENT · AUTHORIZED ACCESS ONLY</div>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <form method="POST">
    <div class="form-group">
      <label>USERNAME</label>
      <input type="text" name="username" required autofocus placeholder="admin"/>
    </div>
    <div class="form-group">
      <label>PASSWORD</label>
      <input type="password" name="password" required placeholder="••••••••"/>
    </div>
    <button class="btn" type="submit">Sign In →</button>
  </form>
</div>
</body>
</html>
