<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>{% block title %}Avida Residence New Manila VisitorsHub{% endblock %} — Visitor Management System</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@400;500&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,400&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg:       #0f1419;
  --surface:  #1a1f2e;
  --border:   #2a3441;
  --accent:   #e53e3e;
  --accent2:  #ff6b6b;
  --secondary: #4a90e2;
  --danger:   #ff3b5c;
  --warn:     #ffb700;
  --text:     #ffffff;
  --muted:    #a0aec0;
  --card:     rgba(26, 31, 46, 0.8);
  --glow:     0 0 24px rgba(229, 62, 62, .18);
  --radius:   12px;
  --mono:     'DM Mono', monospace;
  --sans:     'DM Sans', sans-serif;
  --display:  'Syne', sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;
     background-image:url('/static/img/bg.png');
     background-size:cover;background-position:center;background-repeat:no-repeat;background-attachment:fixed}

/* NAV */
.nav{display:flex;align-items:center;justify-content:space-between;padding:1.5rem 3rem;
     background:rgba(15, 20, 25, 0.95);backdrop-filter:blur(20px);position:sticky;top:0;z-index:100;
     border-bottom:1px solid rgba(255,255,255,0.1)}
.nav-logo{font-family:var(--display);font-weight:800;font-size:1.25rem;letter-spacing:-.02em;
          color:var(--text);display:flex;align-items:center;gap:.75rem;text-decoration:none}
.nav-logo img{height:36px;width:auto}
.nav-links{display:flex;gap:2rem;align-items:center}
.nav-links a{color:var(--muted);text-decoration:none;font-size:.9rem;font-weight:500;
             transition:color .3s;letter-spacing:.02em;padding:0.5rem 0}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--accent)}
.btn{display:inline-flex;align-items:center;gap:.5rem;padding:.6rem 1.5rem;border-radius:var(--radius);
     font-family:var(--sans);font-size:.9rem;font-weight:600;cursor:pointer;
     border:none;transition:all .3s;text-decoration:none}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent2);transform:translateY(-2px);box-shadow:var(--glow)}
.btn-outline{background:transparent;color:var(--text);border:2px solid rgba(255,255,255,0.2)}
.btn-outline:hover{border-color:var(--accent);color:var(--accent);background:rgba(229,62,62,0.1)}
.btn-danger{background:var(--danger);color:#fff}
.btn-sm{padding:.4rem 1rem;font-size:.85rem}

/* FLASH */
.flash{padding:.75rem 1.25rem;border-radius:var(--radius);margin-bottom:1rem;font-size:.875rem}
.flash-error{background:rgba(255,59,92,.12);border:1px solid rgba(255,59,92,.3);color:#ff6b84}
.flash-success{background:rgba(0,119,255,.1);border:1px solid rgba(0,119,255,.25);color:var(--accent)}

/* STATUS */
.badge{display:inline-flex;align-items:center;gap:.3rem;padding:.2rem .6rem;
       border-radius:20px;font-size:.7rem;font-family:var(--mono);font-weight:500;letter-spacing:.05em}
.badge-green{background:rgba(0,229,160,.12);color:#00e5a0;border:1px solid rgba(0,229,160,.2)}
.badge-red{background:rgba(255,59,92,.12);color:var(--danger);border:1px solid rgba(255,59,92,.2)}
.badge-yellow{background:rgba(255,183,0,.12);color:var(--warn);border:1px solid rgba(255,183,0,.2)}
.badge-blue{background:rgba(0,119,255,.12);color:var(--accent);border:1px solid rgba(0,119,255,.2)}
</style>
{% block head %}{% endblock %}
</head>
<body>
<nav class="nav">
  <a href="/" class="nav-logo">
    <img src="/static/img/logo.png" alt="Avida Residence New Manila VisitorsHub Logo"/>
  </a>
  <div class="nav-links">
    <a href="/" {% if request.path=='/' %}class="active"{% endif %}>Home</a>
    <a href="/register" {% if '/register' in request.path %}class="active"{% endif %}>Register</a>
    <a href="/checkin" {% if '/checkin' in request.path %}class="active"{% endif %}>Check-In</a>

  </div>
</nav>
{% block content %}{% endblock %}
{% block scripts %}{% endblock %}
</body>
</html>
